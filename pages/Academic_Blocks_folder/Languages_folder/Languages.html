<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Languages - Atlantic College Memo</title>
    <style>
        @font-face {
            font-family: "Castle Regular";
            src: url("../../../iconntext/font_castle/Myfont-Regular.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
        }

        body {
            margin: 0;
            background: black;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 125;
            pointer-events: none;
            opacity: 1;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.86) 0%, rgba(0, 0, 0, 0.68) 28%, rgba(0, 0, 0, 0.24) 58%, rgba(0, 0, 0, 0) 100%);
            transition: opacity 2s ease;
        }

        body.intro-mask-hidden::before {
            opacity: 0;
        }

        #info {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            pointer-events: none;
            transition: opacity 0.45s ease;
        }

        #info.hidden {
            opacity: 0;
        }

        body.scene-loading #nav,
        body.scene-loading #audio-toggle,
        body.scene-loading #view-indicator,
        body.scene-loading #hero-title,
        body.scene-loading #subpages-panel,
        body.scene-loading #branch-panel,
        body.scene-loading #scene-hotspot,
        body.scene-loading #memory-overlay,
        body.scene-loading #focus-mask,
        body.scene-loading #side-tags,
        body.scene-loading #page-identity-card,
        body.scene-loading #screenshot-button {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        #nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 54px;
            z-index: 160;
        }

        #nav:hover .nav-shell,
        #nav:focus-within .nav-shell {
            transform: translateY(0);
        }

        .nav-shell {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1fr) 72px minmax(0, 1fr) 72px minmax(0, 1fr);
            align-items: center;
            width: 100%;
            height: 54px;
            margin: 0;
            padding: 0 18px;
            border-radius: 0;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03)),
                rgba(10, 10, 10, 0.26);
            border-bottom: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.24);
            transform: translateY(-38px);
            transition: transform 0.32s ease;
        }

        .nav-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 34px;
            padding: 0 10px;
            border-radius: 999px;
            color: rgba(255, 255, 255, 0.92);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 0.14em;
            text-decoration: none;
            text-transform: uppercase;
            transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }

        .nav-icon {
            font-size: 14px;
            line-height: 1;
        }

        .nav-connector {
            width: 72px;
            height: 1px;
            background: rgba(255, 255, 255, 0.58);
            justify-self: center;
        }

        .loading-shell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            padding: 0;
            background: transparent;
            border: 0;
            backdrop-filter: none;
            box-shadow: none;
        }

        .loading-gif {
            display: block;
            width: min(220px, 42vw);
            height: auto;
            border-radius: 18px;
            object-fit: contain;
            filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.34));
        }

        .loading-text {
            color: rgba(255, 255, 255, 0.94);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            padding-left: 0.28em;
        }

        #hint {
            position: fixed;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            z-index: 120;
            max-width: min(92vw, 420px);
            padding: 12px 16px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.58);
            border: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(12px);
            color: rgba(255, 255, 255, 0.88);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 12px;
            line-height: 1.4;
            text-align: center;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        #hint.hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(10px);
        }

        #audio-toggle {
            position: fixed;
            right: 16px;
            bottom: 18px;
            z-index: 145;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 132px;
            min-height: 42px;
            padding: 0 16px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            color: rgba(255, 255, 255, 0.9);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
        }

        #view-indicator {
            position: fixed;
            top: 68px;
            right: 18px;
            z-index: 150;
            min-width: 228px;
            padding: 12px 14px;
            border-radius: 18px;
            background: rgba(0, 0, 0, 0.58);
            border: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(12px);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.24);
            color: rgba(255, 255, 255, 0.92);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        .view-indicator-label {
            display: block;
            color: rgba(255, 255, 255, 0.54);
            font-size: 10px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .view-indicator-value {
            display: block;
            margin-top: 4px;
            font-size: 12px;
            letter-spacing: 0.04em;
            line-height: 1.45;
        }

        .view-indicator-row + .view-indicator-row {
            margin-top: 10px;
        }

        #subpages-panel {
            position: fixed;
            left: 24px;
            bottom: 24px;
            z-index: 135;
            width: min(360px, calc(100vw - 48px));
            padding: 20px 18px 18px;
            border-radius: 24px;
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.08), transparent 26%),
                rgba(10, 10, 10, 0.66);
            border: 1px solid rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(14px);
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
        }

        .subpages-kicker {
            color: rgba(255, 255, 255, 0.56);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .subpages-title {
            margin: 10px 0 8px;
            color: white;
            font-family: "Castle Regular", "Times New Roman", Times, serif;
            font-size: 30px;
            line-height: 1;
        }

        .subpages-copy {
            margin: 0 0 16px;
            color: rgba(255, 255, 255, 0.72);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 13px;
            line-height: 1.6;
        }

        .subpages-list {
            display: grid;
            gap: 10px;
        }

        .subpage-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-height: 46px;
            padding: 0 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.92);
            text-decoration: none;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .subpage-link:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateX(2px);
        }

        .subpage-link span:last-child {
            color: rgba(255, 255, 255, 0.54);
            font-size: 13px;
            letter-spacing: normal;
        }

        #hero-title {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 130;
            pointer-events: none;
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 2s ease, transform 2s ease;
        }

        #hero-title.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #hero-title.hidden {
            opacity: 0;
            transform: translateY(-10px);
        }

        .hero-text { text-align: center; padding: 0 24px; }

        .hero-title-line { color: rgba(255, 255, 255, 0.98); font-family: "Castle Regular", "Times New Roman", serif; font-size: clamp(42px, 8vw, 92px); letter-spacing: 0.08em; text-transform: uppercase; text-shadow: 0 18px 60px rgba(0, 0, 0, 0.58); }

        .hero-subtitle { margin-top: 14px; color: rgba(255, 255, 255, 0.72); font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; }
        .floating-scene-sentence {
            position: fixed; left: 0; top: 0; z-index: 122;
            max-width: min(360px, 82vw); color: rgba(255,255,255,0.94);
            font-family: "Castle Regular", "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 13px; line-height: 1.3; text-shadow: 0 2px 10px rgba(0,0,0,0.78);
            pointer-events: none; opacity: 0; white-space: nowrap;
            transform: translate(-50%, -50%) translateY(-8px);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }
        .floating-scene-sentence.visible { opacity: 1; transform: translate(-50%, -50%) translateY(0); }
        #memory-status {
            position: fixed; left: 50%; bottom: 26px; z-index: 168;
            max-width: min(84vw, 420px); padding: 11px 16px;
            border: 1px solid rgba(255,255,255,0.14); border-radius: 999px;
            background: rgba(0,0,0,0.72); backdrop-filter: blur(10px);
            color: rgba(255,255,255,0.88); font: 11px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif;
            letter-spacing: 0.08em; text-align: center; text-transform: uppercase;
            opacity: 0; pointer-events: none; transform: translate(-50%, 10px);
            transition: opacity 0.22s ease, transform 0.22s ease;
        }
        #memory-status.visible { opacity: 1; transform: translate(-50%, 0); }
    </style>
</head>
<body class="scene-loading">
<div id="info">
    <div class="loading-shell">
        <img class="loading-gif" src="../../../iconntext/loading.GIF" alt="Loading animation">
    </div>
</div>

<nav id="nav" aria-label="Primary">
    <div class="nav-shell">
        <a class="nav-link" href="../../The_Arts_folder/The_Arts.html" aria-label="The Arts location">
            <span class="nav-icon">+</span>
            <span>The Arts</span>
        </a>
        <div class="nav-connector" aria-hidden="true"></div>
        <a class="nav-link" href="../../../index.html" aria-label="Homepage">
            <span class="nav-icon">⌂</span>
            <span>Home</span>
        </a>
        <div class="nav-connector" aria-hidden="true"></div>
        <a class="nav-link" href="../Academic_Blocks.html" aria-label="Academic Blocks location">
            <span class="nav-icon">#</span>
            <span>Academic</span>
        </a>
    </div>
</nav>

<div id="hero-title">
    <div class="hero-text">
        <div class="hero-title-line">Languages</div>
        <div class="hero-subtitle">......</div>
    </div>
</div>

<div id="hint">Drag to orbit. Scroll to zoom. Shift+drag to pan.</div>
<div id="memory-status" role="status" aria-live="polite"></div>

<button id="audio-toggle" type="button" aria-label="Toggle sound">Sound Off</button>

<audio id="ambient-audio" loop preload="auto">
    <source src="../../../Music/outerwilds_cleancover.mp3" type="audio/mpeg">
</audio>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as GaussianSplats3D from 'https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js';
import * as THREE from 'three';
import { initSharedChrome, bindSceneCoordinatePicker, initSharedMusicPlayer, showLoadFailure } from '../../shared-chrome.js?v=20260623more';

const info = document.getElementById('info');
const hint = document.getElementById('hint');
const nav = document.getElementById('nav');
const heroTitle = document.getElementById('hero-title');
const ambientAudio = document.getElementById('ambient-audio');
const memoryStatus = document.getElementById('memory-status');
const languageLocations = {
    'languages': {
        title: 'Languages',
        subtitle: '......',
        scenePath: '../../../Scenes/Languages.ksplat',
        cameraPosition: [15.61, -9.74, 24.12],
        cameraLookAt: [1.25, -7.24, -2.08],
        memories: []
    },
    'languages-1': {
        title: 'Languages 9',
        subtitle: '......',
        scenePath: '../../../Scenes/Languages 1.ksplat',
        cameraPosition: [-2.77, 1.01, 4.93],
        cameraLookAt: [-0.16, -0.22, 0.19],
        memories: [
            { position: [-1.06, 0.10, 0.21], text: 'Climb out the window to the tree...? careful' },
            { position: [-0.36, -0.33, 1.97], text: "sunlight... can't concentrate" }
        ]
    },
    'languages-2': {
        title: 'Languages 7',
        subtitle: '......',
        scenePath: '../../../Scenes/Languages 2.ksplat',
        cameraPosition: [-2.66, 1.90, 3.40],
        cameraLookAt: [2.26, -2.83, -4.90],
        memories: []
    }
};
const requestedLocation = new URLSearchParams(window.location.search).get('location') || 'languages';
const activeLocation = languageLocations[requestedLocation] || languageLocations.languages;
document.title = `${activeLocation.title} - Atlantic College Memo`;
heroTitle.querySelector('.hero-title-line').textContent = activeLocation.title;
heroTitle.querySelector('.hero-subtitle').textContent = activeLocation.subtitle;
initSharedChrome({
    homeHref: '../../../index.html',
    regionalMap: {
        caption: 'Languages Regional Map',
        center: { label: 'Languages', left: '38%', top: '45%' },
        lines: [
            { left: '38%', top: '50%', width: '18%', rotate: '-20deg' },
            { left: '39%', top: '50%', width: '17%', rotate: '24deg' }
        ],
        nodes: [
            { label: 'Languages 9', href: './Languages.html?location=languages-1', left: '58%', top: '34%' },
            { label: 'Languages 7', href: './Languages.html?location=languages-2', left: '58%', top: '63%' }
        ],
        placeCard: {
            kicker: 'Branch',
            title: 'Inside Languages',
            copy: 'Languages 9 and Languages 7 are separate spaces inside the Languages branch.',
            actions: []
        }
    }
});
initSharedMusicPlayer({ homeHref: '../../../index.html' });

const initialCameraPosition = activeLocation.cameraPosition;
const initialCameraLookAt = activeLocation.cameraLookAt;
const initialLookAtVector = new THREE.Vector3(...initialCameraLookAt);
const initialDistance = new THREE.Vector3(...initialCameraPosition).distanceTo(initialLookAtVector);

const viewer = new GaussianSplats3D.Viewer({
    initialCameraPosition,
    initialCameraLookAt,
    sharedMemoryForWorkers: false,
    gpuAcceleratedSort: false,
    dynamicScene: true,
    sceneRevealMode: GaussianSplats3D.SceneRevealMode.Gradual,
    sceneFadeInRateMultiplier: 0.8
});

const modelRotation = new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI, 0, 0));
const MEMORY_REVEAL_DISTANCE = 3.9;
let memoriesVisible = false;
const floatingMemories = activeLocation.memories.map((memory) => {
    const element = document.createElement('div');
    element.className = 'floating-scene-sentence';
    element.textContent = memory.text;
    document.body.appendChild(element);
    return { element, anchor: new THREE.Vector3(...memory.position) };
});

function updateFloatingMemories() {
    if (viewer.camera) {
        floatingMemories.forEach(({ element, anchor }) => {
            const projectedPoint = anchor.clone().project(viewer.camera);
            const isOnScreen = projectedPoint.z > -1 && projectedPoint.z < 1
                && projectedPoint.x >= -1.15 && projectedPoint.x <= 1.15
                && projectedPoint.y >= -1.15 && projectedPoint.y <= 1.15;
            const isNear = viewer.camera.position.distanceTo(anchor) <= MEMORY_REVEAL_DISTANCE;
            if (!memoriesVisible || !isOnScreen || !isNear) {
                element.classList.remove('visible');
                return;
            }
            element.style.left = `${((projectedPoint.x + 1) / 2) * window.innerWidth}px`;
            element.style.top = `${((-projectedPoint.y + 1) / 2) * window.innerHeight}px`;
            element.classList.add('visible');
        });
    }
    window.requestAnimationFrame(updateFloatingMemories);
}

function updateViewIndicator() {
    if (viewer.camera?.position) {
        const currentDistance = viewer.camera.position.distanceTo(initialLookAtVector);
        const zoomPercent = Math.max(1, Math.round((initialDistance / currentDistance) * 100));
    }

    window.requestAnimationFrame(updateViewIndicator);
}

function hideHint() {
    if (!hint || hint.classList.contains('hidden')) return;
    hint.classList.add('hidden');
    window.setTimeout(() => {
        hint.style.display = 'none';
    }, 350);
}

function hideHeroTitle() {
    if (!heroTitle || !heroTitle.classList.contains('visible') || heroTitle.classList.contains('hidden')) return;
    heroTitle.classList.add('hidden');
    document.body.classList.add('intro-mask-hidden');
    window.setTimeout(() => {
        heroTitle.style.display = 'none';
    }, 2000);
}

function showHeroTitle() {
    heroTitle.style.display = 'flex';
    heroTitle.classList.remove('hidden');
    document.body.classList.remove('intro-mask-hidden');
    window.requestAnimationFrame(() => {
        heroTitle.classList.add('visible');
    });
}

window.addEventListener('pointerdown', hideHint, { once: true });
window.addEventListener('wheel', hideHint, { once: true });
window.addEventListener('keydown', hideHint, { once: true });
window.addEventListener('pointerdown', hideHeroTitle, { once: true });
window.addEventListener('wheel', hideHeroTitle, { once: true });
window.addEventListener('keydown', hideHeroTitle, { once: true });
updateViewIndicator();
updateFloatingMemories();

const reviewMemosButton = document.getElementById('review-memos');
if (reviewMemosButton) {
    const replacement = reviewMemosButton.cloneNode(true);
    reviewMemosButton.replaceWith(replacement);
    replacement.setAttribute('aria-pressed', 'false');
    replacement.addEventListener('click', () => {
        document.getElementById('memo-overlay')?.classList.remove('visible');
        document.getElementById('memo-overlay')?.setAttribute('aria-hidden', 'true');
        if (floatingMemories.length) {
            memoriesVisible = !memoriesVisible;
            memoryStatus.classList.remove('visible');
            if (!memoriesVisible) floatingMemories.forEach(({ element }) => element.classList.remove('visible'));
            replacement.setAttribute('aria-pressed', String(memoriesVisible));
            return;
        }
        const showEmptyState = !memoryStatus.classList.contains('visible');
        memoryStatus.textContent = `${activeLocation.title} has no memories yet.`;
        memoryStatus.classList.toggle('visible', showEmptyState);
        replacement.setAttribute('aria-pressed', String(showEmptyState));
    });
}

async function loadScene() {
    const scenePath = activeLocation.scenePath;
    try {
        const response = await fetch(scenePath);
        if (!response.ok) throw new Error(`HTTP ${response.status} while fetching ${scenePath}`);

        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);

        await viewer.addSplatScene(blobUrl, {
            format: GaussianSplats3D.SceneFormat.KSplat,
            rotation: [modelRotation.x, modelRotation.y, modelRotation.z, modelRotation.w],
            showLoadingUI: false,
            progressiveLoad: false
        });

        if (viewer.controls) {
            viewer.controls.minPolarAngle = 0;
            viewer.controls.maxPolarAngle = Math.PI;
            viewer.controls.enablePan = true;
            viewer.controls.update();
        }

        info.classList.add('hidden');
        window.setTimeout(() => {
            info.style.display = 'none';
        }, 450);
        viewer.start();
        document.body.classList.remove('scene-loading');
        bindSceneCoordinatePicker({ viewer, THREE });
        showHeroTitle();
    } catch (err) {
        console.error(err);
        showLoadFailure(info, err, { scenePath });
    }
}

loadScene();
</script>
</body>
</html>
