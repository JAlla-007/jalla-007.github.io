    if (viewer.controls) viewer.controls.update();
}
function hideHint() { if (!hint || hint.classList.contains('hidden')) return; hint.classList.add('hidden'); window.setTimeout(() => { hint.style.display = 'none'; }, 350); }
function hideHeroTitle() { if (!heroTitle || !heroTitle.classList.contains('visible') || heroTitle.classList.contains('hidden')) return; heroTitle.classList.add('hidden'); document.body.classList.add('intro-mask-hidden'); window.setTimeout(() => { heroTitle.style.display = 'none'; }, 2000); }
function showHeroTitle() { heroTitle.style.display = 'flex'; heroTitle.classList.remove('hidden'); document.body.classList.remove('intro-mask-hidden'); window.requestAnimationFrame(() => { heroTitle.classList.add('visible'); }); }
function showCoordinatePopover(message) {
    coordinatePopoverValue.textContent = message;
    coordinatePopover.classList.add('visible');
    if (coordinatePopoverTimer) window.clearTimeout(coordinatePopoverTimer);
    coordinatePopoverTimer = window.setTimeout(() => {
        coordinatePopover.classList.remove('visible');
    }, 2600);
}
async function copyPickedCoordinates(message) {
    try {
        await navigator.clipboard.writeText(message);
        showCoordinatePopover(`${message} Copied.`);
    } catch (err) {
        showCoordinatePopover(message);
    }
}
function bindCoordinatePicker() {
    const canvas = viewer.renderer?.domElement;
    if (!canvas || canvas.dataset.coordinatePickerBound === 'true') return;
    canvas.dataset.coordinatePickerBound = 'true';
    canvas.addEventListener('dblclick', async (event) => {
        if (!viewer.camera || !viewer.splatMesh) return;
        const rect = canvas.getBoundingClientRect();
        const mousePosition = new THREE.Vector2(event.clientX - rect.left, event.clientY - rect.top);
        const renderDimensions = new THREE.Vector2();
        const hits = [];
        viewer.getRenderDimensions(renderDimensions);
        viewer.raycaster.setFromCameraAndScreenPosition(viewer.camera, mousePosition, renderDimensions);
        viewer.raycaster.intersectSplatMesh(viewer.splatMesh, hits);
        if (!hits.length) {
            showCoordinatePopover('No splat hit found at that point.');
            return;
        }
        const { x, y, z } = hits[0].origin;
        const coordinateMessage = `X ${x.toFixed(2)} Y ${y.toFixed(2)} Z ${z.toFixed(2)}`;
        await copyPickedCoordinates(coordinateMessage);
    });
}
function projectSceneBeacon(anchor, element) {
    const projectedPoint = anchor.clone().project(viewer.camera);
    const isVisible = projectedPoint.z > -1 && projectedPoint.z < 1
        && projectedPoint.x >= -1.15 && projectedPoint.x <= 1.15
        && projectedPoint.y >= -1.15 && projectedPoint.y <= 1.15;
    if (!isVisible) {
        element.classList.remove('visible');
        element.classList.remove('near');
        return false;
    }
    const x = ((projectedPoint.x + 1) / 2) * window.innerWidth;
    const y = ((-projectedPoint.y + 1) / 2) * window.innerHeight;
    element.style.left = `${x}px`;
    element.style.top = `${y}px`;
    element.classList.add('visible');
    return true;
}
function renderMemoryGallery() {
    if (!memoryGallery || !activeMemory) return;
    const images = activeMemory.images || [];
    if (!images.length) {
        memoryGallery.dataset.memoryId = activeMemory.id;
        memoryGallery.innerHTML = '<div class="memory-gallery-empty">No photos</div>';
        return;
    }

    activeMemoryImageIndex = ((activeMemoryImageIndex % images.length) + images.length) % images.length;
    const imagePath = images[activeMemoryImageIndex];
    const showNav = images.length > 1;
    if (memoryGallery.dataset.memoryId !== activeMemory.id) {
        memoryGallery.dataset.memoryId = activeMemory.id;
        memoryGallery.innerHTML = `
            <figure class="memory-photo">
                <img class="memory-gallery-image" alt="" decoding="async">
            </figure>
            <button class="memory-gallery-nav memory-gallery-prev" type="button" aria-label="Previous photo">‹</button>
            <button class="memory-gallery-nav memory-gallery-next" type="button" aria-label="Next photo">›</button>
            <div class="memory-gallery-count"></div>
        `;
        preloadMemoryImages(images);
    }

    const galleryImage = memoryGallery.querySelector('.memory-gallery-image');
    const galleryPrev = memoryGallery.querySelector('.memory-gallery-prev');
    const galleryNext = memoryGallery.querySelector('.memory-gallery-next');
    const galleryCount = memoryGallery.querySelector('.memory-gallery-count');

    if (galleryImage) {
        galleryImage.src = imagePath;
        galleryImage.alt = `${activeMemory.title} photo ${activeMemoryImageIndex + 1}`;
    }
    if (galleryPrev) galleryPrev.hidden = !showNav;
    if (galleryNext) galleryNext.hidden = !showNav;
    if (galleryCount) galleryCount.textContent = `${activeMemoryImageIndex + 1} / ${images.length}`;
}
function openMemory(memory) {
    activeMemory = memory;
    activeMemoryImageIndex = 0;
    memoryKicker.textContent = memory.kicker;
    memoryTitle.textContent = memory.title;
    memoryCopy.textContent = memory.copy;
    memoryGallery.dataset.memoryId = '';
    renderMemoryGallery();
    memoryOverlay.classList.add('visible');
    memoryOverlay.setAttribute('aria-hidden', 'false');
}
function preloadMemoryImages(images) {
    images.forEach((imagePath) => {
        const image = new Image();
        image.src = imagePath;
    });
}
function stepMemoryGallery(direction) {
    if (!activeMemory?.images?.length) return;
    activeMemoryImageIndex += direction;
    renderMemoryGallery();
}
function ensureMemoryBeacons() {
    if (memoryBeaconElements.length) return;
    memoryBeaconElements = MEMORY_BEACONS.map((memory) => {
        const element = document.createElement('button');
        element.type = 'button';
        element.className = 'scene-beacon memory-beacon';
        element.setAttribute('aria-label', `Open memory ${memory.title}`);
        element.innerHTML = `<span class="scene-beacon-core" aria-hidden="true"><img class="scene-beacon-gif" src="../../iconntext/Beacon.GIF" alt=""></span><span class="scene-beacon-label">${memory.label}</span>`;
        element.addEventListener('click', () => {
            openMemory(memory);
        });
        document.body.appendChild(element);
        return { element, memory };
    });
}
function updateMemoryBeacons() {
    if (!viewer.camera) {
        window.requestAnimationFrame(updateMemoryBeacons);
        return;
    }
    memoryBeaconElements.forEach(({ element, memory }) => {
        if (!memoryBeaconsVisible) {
            element.classList.remove('visible');
            element.classList.remove('near');
            return;
        }
        if (projectSceneBeacon(memory.anchor, element)) {
            const cameraDistance = viewer.camera.position.distanceTo(memory.anchor);
            element.classList.toggle('near', cameraDistance <= MEMORY_REVEAL_DISTANCE);
        }
    });
    window.requestAnimationFrame(updateMemoryBeacons);
}
function toggleMemoryBeacons() {
    ensureMemoryBeacons();
    memoryBeaconsVisible = !memoryBeaconsVisible;
    if (!memoryBeaconsVisible) {
        memoryOverlay.classList.remove('visible');
        memoryOverlay.setAttribute('aria-hidden', 'true');
    }
}
function updateViewIndicator() { if (viewer.camera?.position) { enforceCameraConstraints(); const currentDistance = viewer.camera.position.distanceTo(initialLookAtVector); const zoomPercent = Math.max(MIN_ZOOM_PERCENT, Math.round((zoomReferenceDistance / currentDistance) * 100)); } window.requestAnimationFrame(updateViewIndicator); }
window.addEventListener('pointerdown', hideHint, { once: true });
window.addEventListener('wheel', hideHint, { once: true });
window.addEventListener('keydown', hideHint, { once: true });
window.addEventListener('pointerdown', hideHeroTitle, { once: true });
window.addEventListener('wheel', hideHeroTitle, { once: true });
window.addEventListener('keydown', hideHeroTitle, { once: true });
memoryClose.addEventListener('click', () => {
    memoryOverlay.classList.remove('visible');
    memoryOverlay.setAttribute('aria-hidden', 'true');
});
memoryOverlay.addEventListener('click', (event) => {
    if (event.target !== memoryOverlay) return;
    memoryOverlay.classList.remove('visible');
    memoryOverlay.setAttribute('aria-hidden', 'true');
});
memoryGallery.addEventListener('click', (event) => {
    if (event.target.closest('.memory-gallery-prev')) {
        stepMemoryGallery(-1);
    } else if (event.target.closest('.memory-gallery-next')) {
        stepMemoryGallery(1);
    }
});
updateViewIndicator();
updateMemoryBeacons();
async function loadScene() {
    try {
        const response = await fetch('../../PK.ksplat');
        if (!response.ok) throw new Error(`HTTP ${response.status} while fetching PK.ksplat`);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        await viewer.addSplatScene(blobUrl, { format: GaussianSplats3D.SceneFormat.KSplat, rotation: [modelRotation.x, modelRotation.y, modelRotation.z, modelRotation.w], showLoadingUI: false, progressiveLoad: false });
        if (viewer.controls) { viewer.controls.minPolarAngle = 0; viewer.controls.maxPolarAngle = Math.PI; viewer.controls.enablePan = true; viewer.controls.maxDistance = maxCameraDistance; viewer.controls.update(); }
        enforceCameraConstraints();
        info.classList.add('hidden');
        window.setTimeout(() => { info.style.display = 'none'; }, 450);
        viewer.start();
        document.body.classList.remove('scene-loading');
        bindCoordinatePicker();
        bindCameraViewClipboard({ viewer });
        showHeroTitle();
    } catch (err) {
        console.error(err);
        showLoadFailure(info, err, { scenePath: '../../PK.ksplat' });
    }
}
loadScene();
const reviewMemosButton = document.getElementById('review-memos');
if (reviewMemosButton) {
    const replacement = reviewMemosButton.cloneNode(true);
    reviewMemosButton.replaceWith(replacement);
    replacement.addEventListener('click', toggleMemoryBeacons);
}
window.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
        memoryOverlay.classList.remove('visible');
        memoryOverlay.setAttribute('aria-hidden', 'true');
    } else if (memoryOverlay.classList.contains('visible') && event.key === 'ArrowLeft') {
        stepMemoryGallery(-1);
    } else if (memoryOverlay.classList.contains('visible') && event.key === 'ArrowRight') {
        stepMemoryGallery(1);
    }
});
</script>
</body>
