        .memory-panel {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 44%) minmax(0, 1fr);
            grid-template-rows: minmax(90px, auto) minmax(0, 1fr);

            overflow: hidden;

        .memory-kicker {

            letter-spacing: 0.24em;

            grid-column: 2;

            min-width: 0;

        .memory-copy {
            grid-column: 2;
            grid-row: 2;
            width: 100%;

            font-size: 15px;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .memory-gallery {
            grid-column: 1;
            grid-row: 1 / -1;
            position: relative;
            contain: layout paint;
            width: 100%;
            height: 100%;
            min-height: 0;

            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;

        .memory-panel.memory-panel-no-gallery {
            grid-template-columns: 1fr;

        .memory-panel.memory-panel-no-gallery .memory-title,
        .memory-panel.memory-panel-no-gallery .memory-copy {
            grid-column: 1;

        .memory-panel.memory-panel-no-gallery .memory-gallery {
            display: none;
        }
        .memory-panel.memory-panel-media-only {
            display: block;
            width: auto;
            height: auto;
            max-width: calc(100vw - 56px);
            max-height: calc(100vh - 56px);
            padding: 12px;
            overflow: visible;
        }
        .memory-panel.memory-panel-media-only .memory-title,
        .memory-panel.memory-panel-media-only .memory-copy,
        .memory-panel.memory-panel-media-only .memory-kicker {
            display: none;

        .memory-panel.memory-panel-media-only .memory-gallery {
            display: block;
            width: auto;
            height: auto;
            max-width: calc(100vw - 80px);
            max-height: calc(100vh - 80px);
            border: 0;
            border-radius: 18px;
            background: transparent;
        }
        .memory-panel.memory-panel-media-only .memory-photo {
            width: auto;
            height: auto;
            max-width: inherit;
            max-height: inherit;
            border-radius: 16px;
        }
        .memory-panel.memory-panel-media-only .memory-photo img,
        .memory-panel.memory-panel-media-only .memory-photo video {
            width: auto;
            height: auto;
            max-width: calc(100vw - 80px);
            max-height: calc(100vh - 80px);
            border-radius: 16px;
            object-fit: contain;
        }
        .memory-photo {
            display: block;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            margin: 0;
            overflow: hidden;
        }

        .memory-photo img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .memory-photo video {
            display: block;
            width: 100%;
            height: 100%;
            background: black;
            object-fit: contain;
            object-position: center;
        }

        .memory-gallery-empty {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: rgba(255,255,255,0.46);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .memory-gallery-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 42px;
            height: 42px;
            border: 1px solid rgba(255,255,255,0.18);

            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .memory-gallery-nav[hidden] {
            display: none;

        .memory-gallery-prev {
            left: 12px;
        }

        .memory-gallery-next {
            right: 12px;
        }

        .memory-gallery-count {

            font-size: 11px;
        }

        @media (max-width: 720px) {
            .memory-panel {
                grid-template-columns: 1fr;
                grid-template-rows: auto minmax(0, 1fr) 300px;

            .memory-gallery,

            left: 20px;

        .memory-lightbox-next {

        #hero-title {

function enforceCameraConstraints() {
    if (!viewer.camera?.position) return;

    const cameraPosition = viewer.camera.position;
    const distanceFromCenter = cameraPosition.distanceTo(initialLookAtVector);
    if (distanceFromCenter > maxCameraDistance) {
        cameraPosition.sub(initialLookAtVector).setLength(maxCameraDistance).add(initialLookAtVector);
    } else if (distanceFromCenter < minCameraDistance) {
        cameraPosition.sub(initialLookAtVector).setLength(minCameraDistance).add(initialLookAtVector);
    }

    if (viewer.controls) viewer.controls.update();
}

function updateViewIndicator() {
    if (viewer.camera?.position) {
        enforceCameraConstraints();
        const currentDistance = viewer.camera.position.distanceTo(initialLookAtVector);
        const zoomPercent = Math.max(1, Math.round((zoomReferenceDistance / currentDistance) * 100));
    }

    window.requestAnimationFrame(updateViewIndicator);
}

function projectSceneBeacon(anchor, element) {
    const projectedPoint = anchor.clone().project(viewer.camera);
    const isVisible = projectedPoint.z > -1 && projectedPoint.z < 1
        && projectedPoint.x >= -1.15 && projectedPoint.x <= 1.15
        && projectedPoint.y >= -1.15 && projectedPoint.y <= 1.15;
    if (!isVisible) {
        element.classList.remove('visible');
        element.classList.remove('near');
        return false;
    }
    const x = ((projectedPoint.x + 1) / 2) * window.innerWidth;
    const y = ((-projectedPoint.y + 1) / 2) * window.innerHeight;
    element.style.left = `${x}px`;
    element.style.top = `${y}px`;
    element.classList.add('visible');
    return true;
}

function openMemory(memory) {
    activeMemory = memory;
    activeMemoryImageIndex = 0;
    memoryKicker.textContent = memory.kicker;
    memoryTitle.textContent = memory.title;
    memoryCopy.textContent = memory.copy;
    memoryGallery.dataset.memoryId = '';
    renderMemoryGallery();
    memoryOverlay.classList.add('visible');
    memoryOverlay.setAttribute('aria-hidden', 'false');
}

function preloadMemoryImages(images) {
    images.forEach((imagePath) => {
        const image = new Image();
        image.src = imagePath;
    });
}

function getMemoryMedia(memory) {
    if (memory.media?.length) return memory.media;
    return (memory.images || []).map((src) => ({ type: 'image', src }));
}

function renderMemoryGallery() {
    if (!memoryGallery || !activeMemory) return;
    const media = getMemoryMedia(activeMemory);
    const isMediaOnly = media.length > 0 && !activeMemory.copy?.trim();
    memoryPanel.classList.toggle('memory-panel-media-only', isMediaOnly);
    if (!media.length) {
        memoryGallery.dataset.memoryId = activeMemory.id;
        memoryGallery.innerHTML = '';
        memoryGallery.hidden = true;
        memoryPanel.classList.add('memory-panel-no-gallery');
        memoryPanel.classList.remove('memory-panel-media-only');
        return;
    }

    memoryGallery.hidden = false;
    memoryPanel.classList.remove('memory-panel-no-gallery');
    activeMemoryImageIndex = ((activeMemoryImageIndex % media.length) + media.length) % media.length;
    const currentMedia = media[activeMemoryImageIndex];
    const showNav = media.length > 1;
    if (memoryGallery.dataset.memoryId !== activeMemory.id) {
        memoryGallery.dataset.memoryId = activeMemory.id;
        memoryGallery.innerHTML = `
            <figure class="memory-photo">
                <img class="memory-gallery-image" alt="" decoding="async" hidden>
                <video class="memory-gallery-video" controls playsinline preload="metadata" hidden></video>
            </figure>
            <button class="memory-gallery-nav memory-gallery-prev" type="button" aria-label="Previous photo">‹</button>
            <button class="memory-gallery-nav memory-gallery-next" type="button" aria-label="Next photo">›</button>
            <div class="memory-gallery-count"></div>
        `;
        preloadMemoryImages(media.filter((item) => item.type === 'image').map((item) => item.src));
    }

    const galleryImage = memoryGallery.querySelector('.memory-gallery-image');
    const galleryVideo = memoryGallery.querySelector('.memory-gallery-video');
    const galleryPrev = memoryGallery.querySelector('.memory-gallery-prev');
    const galleryNext = memoryGallery.querySelector('.memory-gallery-next');
    const galleryCount = memoryGallery.querySelector('.memory-gallery-count');

    if (galleryImage && galleryVideo) {
        const isVideo = currentMedia.type === 'video';
        galleryImage.hidden = isVideo;
        galleryVideo.hidden = !isVideo;
        if (isVideo) {
            galleryVideo.innerHTML = `<source src="${currentMedia.src}" type="${currentMedia.mime || 'video/mp4'}">`;
            galleryVideo.load();
            galleryImage.removeAttribute('src');
        } else {
            galleryImage.src = currentMedia.src;
            galleryVideo.removeAttribute('src');
            galleryVideo.innerHTML = '';
        }
        galleryImage.alt = `${activeMemory.title} photo ${activeMemoryImageIndex + 1}`;
    }
    if (galleryPrev) galleryPrev.hidden = !showNav;
    if (galleryNext) galleryNext.hidden = !showNav;
    if (galleryCount) galleryCount.textContent = `${activeMemoryImageIndex + 1} / ${media.length}`;
}

function stepMemoryGallery(direction) {
    if (!getMemoryMedia(activeMemory || {}).length) return;
    activeMemoryImageIndex += direction;
    renderMemoryGallery();
}

function ensureMemoryBeacons() {
    if (memoryBeaconElements.length) return;
    memoryBeaconElements = MEMORY_BEACONS.map((memory) => {
        const element = document.createElement('button');
        element.type = 'button';
        element.className = 'scene-beacon memory-beacon';
        element.setAttribute('aria-label', `Open memory ${memory.title}`);
        element.innerHTML = `<span class="scene-beacon-core" aria-hidden="true"><img class="scene-beacon-gif" src="../../../iconntext/Beacon.GIF" alt=""></span><span class="scene-beacon-label">${memory.label}</span>`;
        element.addEventListener('click', () => {
            openMemory(memory);
        });
        document.body.appendChild(element);
        return { element, memory };
    });
    floatingSentenceElements = FLOATING_SENTENCES.map((sentence) => {
        const element = document.createElement('div');
        element.className = 'floating-scene-sentence';
        element.textContent = sentence.text;
        document.body.appendChild(element);
        return { element, sentence };
    });
}

function updateMemoryBeacons() {
    if (!viewer.camera) {
        window.requestAnimationFrame(updateMemoryBeacons);
        return;
    }
    memoryBeaconElements.forEach(({ element, memory }) => {
        if (!memoryBeaconsVisible) {
            element.classList.remove('visible');
            element.classList.remove('near');
            return;
        }
        if (projectSceneBeacon(memory.anchor, element)) {
            const cameraDistance = viewer.camera.position.distanceTo(memory.anchor);
            element.classList.toggle('near', cameraDistance <= MEMORY_REVEAL_DISTANCE);
        }
    });
    floatingSentenceElements.forEach(({ element, sentence }) => {
        if (!memoryBeaconsVisible) {
            element.classList.remove('visible');
            return;
        }
        if (projectSceneBeacon(sentence.anchor, element)) {
            const cameraDistance = viewer.camera.position.distanceTo(sentence.anchor);
            element.classList.toggle('visible', cameraDistance <= FLOATING_SENTENCE_REVEAL_DISTANCE);
        }
    });
    window.requestAnimationFrame(updateMemoryBeacons);
}

function toggleMemoryBeacons() {
    if (beaconLayerSwitchTimer) window.clearTimeout(beaconLayerSwitchTimer);

}

    }
});

    if (!memoryOverlay.classList.contains('visible')) return;
    if (event.key === 'Escape') {
        memoryOverlay.classList.remove('visible');
        memoryOverlay.setAttribute('aria-hidden', 'true');
    } else if (event.key === 'ArrowLeft') {
        stepMemoryGallery(-1);
    } else if (event.key === 'ArrowRight') {
        stepMemoryGallery(1);
    }
});

async function loadScene() {
    try {
        const response = await fetch('../../../Scenes/Mydorm.ksplat');
        if (!response.ok) throw new Error(`HTTP ${response.status} while fetching Mydorm.ksplat`);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        await viewer.addSplatScene(blobUrl, {
            format: GaussianSplats3D.SceneFormat.KSplat,
            rotation: [modelRotation.x, modelRotation.y, modelRotation.z, modelRotation.w],
            showLoadingUI: false,
            progressiveLoad: false
        });
        if (viewer.controls) {
            viewer.controls.minPolarAngle = 0;
            viewer.controls.maxPolarAngle = Math.PI;
            viewer.controls.enablePan = true;
            viewer.controls.minDistance = minCameraDistance;
            viewer.controls.maxDistance = maxCameraDistance;
            viewer.controls.update();
        }
        enforceCameraConstraints();
        info.classList.add('hidden');
        window.setTimeout(() => {
            info.style.display = 'none';
        }, 450);
        viewer.start();
        document.body.classList.remove('scene-loading');
        bindSceneCoordinatePicker({ viewer, THREE });
        showHeroTitle();
    } catch (err) {
        console.error(err);
        showLoadFailure(info, err, { scenePath: '../../../Scenes/Mydorm.ksplat' });
    }
}

loadScene();

const reviewMemosButton = document.getElementById('review-memos');
if (reviewMemosButton) {
    const replacement = reviewMemosButton.cloneNode(true);
    reviewMemosButton.replaceWith(replacement);
    replacement.addEventListener('click', toggleMemoryBeacons);
}

const reviewNotesButton = document.getElementById('review-notes');
if (reviewNotesButton) {
    const replacement = reviewNotesButton.cloneNode(true);
    reviewNotesButton.replaceWith(replacement);
    replacement.addEventListener('click', toggleObjectBeacons);
}

window.addEventListener('keydown', (event) => {
    if (event.key !== 'Escape') return;
    memoryOverlay.classList.remove('visible');
    memoryOverlay.setAttribute('aria-hidden', 'true');
});
</script>
</body>
