<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Corner - Atlantic College Memo</title>
    <style>
        @font-face {
            font-family: "Castle Regular";
            src: url("../../../iconntext/font_castle/Myfont-Regular.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
        }

        body {
            margin: 0;
            background: black;
            overflow: hidden;
        }

        body.scene-loading #nav,
        body.scene-loading #hint,
        body.scene-loading #hero-title,
        body.scene-loading #side-tags,
        body.scene-loading #screenshot-button {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        #info {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            pointer-events: none;
            transition: opacity 0.45s ease;
        }

        #info.hidden { opacity: 0; }

        .loading-shell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            padding: 0;
            background: transparent;
            border: 0;
            backdrop-filter: none;
            box-shadow: none;
        }

        .loading-gif {
            display: block;
            width: min(220px, 42vw);
            height: auto;
            border-radius: 18px;
            object-fit: contain;
            filter: drop-shadow(0 10px 28px rgba(0,0,0,0.34));
        }

        #hero-title {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 130;
            pointer-events: none;
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 2s ease, transform 2s ease;
        }

        #hero-title.visible { opacity: 1; transform: translateY(0); }
        #hero-title.hidden { opacity: 0; transform: translateY(-10px); }

        .hero-text { text-align: center; padding: 0 24px; }

        .hero-title-line {
            color: rgba(255, 255, 255, 0.98);
            font-family: "Castle Regular", "Times New Roman", serif;
            font-size: clamp(42px, 8vw, 92px);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-shadow: 0 18px 60px rgba(0, 0, 0, 0.58);
        }

        .hero-subtitle {
            margin-top: 14px;
            color: rgba(255, 255, 255, 0.72);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 13px;
            letter-spacing: 0.24em;
            text-transform: uppercase;
        }

        #hint {
            position: fixed;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%);
            z-index: 120;
            max-width: min(92vw, 420px);
            padding: 12px 16px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.14);
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(10px);
            color: rgba(255,255,255,0.88);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 12px;
            text-align: center;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        #hint.hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(10px);
        }
    </style>
</head>
<body class="scene-loading">
<div id="info"><div class="loading-shell"><img class="loading-gif" src="../../../iconntext/loading.GIF" alt="Loading animation"></div></div>
<nav id="nav" aria-label="Primary"></nav>
<div id="hero-title"><div class="hero-text"><div class="hero-title-line">My Corner</div><div class="hero-subtitle">my second dorm</div></div></div>
<div id="hint">Drag to orbit. Scroll to zoom. Shift+drag to pan.</div>

<script type="importmap">

</script>
<script type="module">
import * as GaussianSplats3D from 'https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js';
import * as THREE from 'three';
import { initSharedChrome, bindSceneCoordinatePicker, showLoadFailure } from '../../shared-chrome.js?v=20260623more';

const info = document.getElementById('info');
const hint = document.getElementById('hint');
const heroTitle = document.getElementById('hero-title');

initSharedChrome({
    homeHref: '../../../index.html',
    regionalMap: {
        caption: 'Music Regional Map',
        center: { label: 'My Corner', left: '38%', top: '45%' },
        lines: [
            { left: '39%', top: '50%', width: '17%', rotate: '-24deg' },
            { left: '39%', top: '50%', width: '17%', rotate: '22deg' }
        ],
        nodes: [
            { label: 'Music Classroom', href: './Music_Classroom.html', left: '58%', top: '34%' },
            { label: 'Practice Room', href: './Practice_Room.html', left: '58%', top: '62%' }
        ],
        placeCard: {
            kicker: 'Branch',
            title: 'Inside Music',
            copy: 'This local map keeps your personal corner anchored to the nearby music spaces.',
            actions: []
        }
    },
    keepSubpagesPanel: true
});

const initialCameraPosition = [0.24, 1.22, 1.70];
const initialCameraLookAt = [-0.18, 0.72, -0.97];
const initialLookAtVector = new THREE.Vector3(...initialCameraLookAt);
const initialDistance = new THREE.Vector3(...initialCameraPosition).distanceTo(initialLookAtVector);
const modelRotation = new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI, 0, 0));

const viewer = new GaussianSplats3D.Viewer({
    initialCameraPosition,
    initialCameraLookAt,
    sharedMemoryForWorkers: false,
    gpuAcceleratedSort: false,
    dynamicScene: true,
    sceneRevealMode: GaussianSplats3D.SceneRevealMode.Gradual,
    sceneFadeInRateMultiplier: 0.8
});

function updateViewIndicator() {
    if (viewer.camera?.position) {
        const currentDistance = viewer.camera.position.distanceTo(initialLookAtVector);
        Math.max(1, Math.round((initialDistance / currentDistance) * 100));
    }
    window.requestAnimationFrame(updateViewIndicator);
}

function hideHint() {
    if (!hint || hint.classList.contains('hidden')) return;
    hint.classList.add('hidden');
    window.setTimeout(() => {
        hint.style.display = 'none';
    }, 350);
}

function hideHeroTitle() {
    if (!heroTitle || !heroTitle.classList.contains('visible') || heroTitle.classList.contains('hidden')) return;
    heroTitle.classList.add('hidden');
    window.setTimeout(() => {
        heroTitle.style.display = 'none';
    }, 2000);
}

function showHeroTitle() {
    heroTitle.style.display = 'flex';
    heroTitle.classList.remove('hidden');
    window.requestAnimationFrame(() => {
        heroTitle.classList.add('visible');
    });
}

window.addEventListener('pointerdown', hideHint, { once: true });
window.addEventListener('wheel', hideHint, { once: true });
window.addEventListener('keydown', hideHint, { once: true });
window.addEventListener('pointerdown', hideHeroTitle, { once: true });
window.addEventListener('wheel', hideHeroTitle, { once: true });
window.addEventListener('keydown', hideHeroTitle, { once: true });

updateViewIndicator();

async function loadScene() {
    try {
        const response = await fetch('../../../Scenes/mycorner.ksplat');
        if (!response.ok) throw new Error(`HTTP ${response.status} while fetching mycorner.ksplat`);
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        await viewer.addSplatScene(blobUrl, {
            format: GaussianSplats3D.SceneFormat.KSplat,
            rotation: [modelRotation.x, modelRotation.y, modelRotation.z, modelRotation.w],
            showLoadingUI: false,
            progressiveLoad: false
        });
        if (viewer.controls) {
            viewer.controls.minPolarAngle = 0;
            viewer.controls.maxPolarAngle = Math.PI;
            viewer.controls.enablePan = true;
            viewer.controls.rotateSpeed = 0.4;
            viewer.controls.zoomSpeed = 0.6;
            viewer.controls.panSpeed = 0.45;
            viewer.controls.enableDamping = true;
            viewer.controls.dampingFactor = 0.08;
            viewer.controls.update();
        }
        info.classList.add('hidden');
        window.setTimeout(() => {
            info.style.display = 'none';
        }, 450);
        viewer.start();
        document.body.classList.remove('scene-loading');
        bindSceneCoordinatePicker({ viewer, THREE });
        showHeroTitle();
    } catch (err) {
        console.error(err);
        showLoadFailure(info, err, { scenePath: '../../../Scenes/mycorner.ksplat' });
    }
}

loadScene();
</script>
</body>
</html>
