<script type="module">
import * as GaussianSplats3D from 'https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js';
import * as THREE from 'three';
import { initSharedChrome, bindSceneCoordinatePicker, initSharedMusicPlayer, showLoadFailure } from '../shared-chrome.js?v=20260623more';

const info = document.getElementById('info');
const hint = document.getElementById('hint');
const nav = document.getElementById('nav');
const heroTitle = document.getElementById('hero-title');
const ambientAudio = document.getElementById('ambient-audio');
const memoryOverlay = document.getElementById('memory-overlay');
const memoryClose = document.getElementById('memory-close');
const memoryKicker = document.getElementById('memory-kicker');
const memoryTitle = document.getElementById('memory-title');
const memoryCopy = document.getElementById('memory-copy');
initSharedChrome({
    homeHref: '../../index.html',
    regionalMap: {
        caption: 'Music Regional Map',
        center: { label: 'Music Department', left: '38%', top: '45%' },
        lines: [
            { left: '38%', top: '50%', width: '18%', rotate: '-24deg' },
            { left: '39%', top: '49%', width: '17%', rotate: '18deg' },
            { left: '33%', top: '47%', width: '15%', rotate: '176deg' }
        ],
        nodes: [
            { label: 'Classroom', href: './Music_regional/Music_Classroom.html', left: '58%', top: '32%' },
            { label: 'Practice Room', href: './Music_regional/Practice_Room.html', left: '57%', top: '61%' },
            { label: 'My Corner', href: './Music_regional/My_Corner.html', left: '15%', top: '53%' }
        ],
        placeCard: {
            kicker: 'Branch',
            title: 'Inside Music',
            copy: 'A smaller map of the music area, where each room can branch into its own memory layer and scan.',
            actions: [
                { label: 'Play Ukulele', href: './Music_regional/Ukulele.html' }
            ]
        }
    }
});
initSharedMusicPlayer({ homeHref: '../../index.html' });

const initialCameraPosition = [7.28, 2.05, 17.33];
const initialCameraLookAt = [0, 0, 0];
const initialLookAtVector = new THREE.Vector3(...initialCameraLookAt);
const DEFAULT_ZOOM_PERCENT = 100;
const MIN_ZOOM_PERCENT = 72;
const MIN_CAMERA_Y = -0.5;
const MAX_CAMERA_Y = 7.5;
const initialDistance = new THREE.Vector3(...initialCameraPosition).distanceTo(initialLookAtVector);
const zoomReferenceDistance = initialDistance * (DEFAULT_ZOOM_PERCENT / 100);
const maxCameraDistance = zoomReferenceDistance / (MIN_ZOOM_PERCENT / 100);
const minCameraDistance = zoomReferenceDistance / 2.4;

const viewer = new GaussianSplats3D.Viewer({
    initialCameraPosition,
    initialCameraLookAt,
    sharedMemoryForWorkers: false,
    gpuAcceleratedSort: false,
    dynamicScene: true,
    sceneRevealMode: GaussianSplats3D.SceneRevealMode.Gradual,
    sceneFadeInRateMultiplier: 0.8
});

const modelRotation = new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI, 0, 0));
const MEMORY_REVEAL_DISTANCE = 12;
const FLOATING_SENTENCE_REVEAL_DISTANCE = 9;
const MEMORY_BEACONS = [
    {
        id: 'arrival',
        label: 'Arrival',
        anchor: new THREE.Vector3(-0.04, -0.14, -0.54),
        kicker: 'Memory Fragment',
        title: 'Sep 04, 2024',
        copy: 'Dear Diary,\n(11:16)\nlate.. kinda\nOh but I did enjoyed the codes a lot. I love music department.\nThis place is so amazing. It has everything one could ever need.\nEven the food tastes good!\nlove this place.\nThe piano room was super awesome, I could literally spend a whole day practicing there.\nFOR REAL.\n\n(11:33)\n我有些纠结...\nsubject choices'
    }
];
let memoryBeaconsVisible = false;
let memoryBeaconElements = [];
let floatingSentenceElements = [];
const FLOATING_SENTENCES = [
    {
        anchor: new THREE.Vector3(6.86, 0.41, 0.34),
        text: 'you could get in through this window... in emergencies of course (remember to leave it open)'
    }
];

function enforceCameraConstraints() {
    if (!viewer.camera?.position) return;

    const cameraPosition = viewer.camera.position;
    cameraPosition.y = THREE.MathUtils.clamp(cameraPosition.y, MIN_CAMERA_Y, MAX_CAMERA_Y);

    const distanceFromCenter = cameraPosition.distanceTo(initialLookAtVector);
    if (distanceFromCenter > maxCameraDistance) {
        cameraPosition.sub(initialLookAtVector).setLength(maxCameraDistance).add(initialLookAtVector);
    } else if (distanceFromCenter < minCameraDistance) {
        cameraPosition.sub(initialLookAtVector).setLength(minCameraDistance).add(initialLookAtVector);
    }

    if (viewer.controls?.target) {
        viewer.controls.target.x = THREE.MathUtils.clamp(viewer.controls.target.x, -3.5, 3.5);
        viewer.controls.target.y = THREE.MathUtils.clamp(viewer.controls.target.y, -1.2, 3.8);
        viewer.controls.target.z = THREE.MathUtils.clamp(viewer.controls.target.z, -3.5, 3.5);
    }

    if (viewer.controls) viewer.controls.update();
}

function updateViewIndicator() {
    if (viewer.camera?.position) {
        enforceCameraConstraints();
        const currentDistance = viewer.camera.position.distanceTo(initialLookAtVector);
        const zoomPercent = Math.max(MIN_ZOOM_PERCENT, Math.round((zoomReferenceDistance / currentDistance) * 100));
    }

    window.requestAnimationFrame(updateViewIndicator);
}

function hideHint() {
    if (!hint || hint.classList.contains('hidden')) return;
    hint.classList.add('hidden');
    window.setTimeout(() => {
        hint.style.display = 'none';
    }, 350);
}

function hideHeroTitle() {
    if (!heroTitle || !heroTitle.classList.contains('visible') || heroTitle.classList.contains('hidden')) return;
    heroTitle.classList.add('hidden');
    document.body.classList.add('intro-mask-hidden');
    window.setTimeout(() => {
        heroTitle.style.display = 'none';
    }, 2000);
}

function showHeroTitle() {
    heroTitle.style.display = 'flex';
    heroTitle.classList.remove('hidden');
    document.body.classList.remove('intro-mask-hidden');
    window.requestAnimationFrame(() => {
        heroTitle.classList.add('visible');
    });
}

function projectSceneBeacon(anchor, element) {
    if (!viewer.camera) return false;
    const projectedPoint = anchor.clone().project(viewer.camera);
    const isVisible = projectedPoint.z > -1 && projectedPoint.z < 1
        && projectedPoint.x >= -1.15 && projectedPoint.x <= 1.15
        && projectedPoint.y >= -1.15 && projectedPoint.y <= 1.15;
    if (!isVisible) {
        element.classList.remove('visible');
        element.classList.remove('near');
        return false;
    }

    const x = ((projectedPoint.x + 1) / 2) * window.innerWidth;
    const y = ((-projectedPoint.y + 1) / 2) * window.innerHeight;
    element.style.left = `${x}px`;
    element.style.top = `${y}px`;
    element.classList.add('visible');
    return true;
}

function openMemory(memory) {
    memoryKicker.textContent = memory.kicker;
    memoryTitle.textContent = memory.title;
    memoryCopy.textContent = memory.copy;
    memoryOverlay.classList.add('visible');
    memoryOverlay.setAttribute('aria-hidden', 'false');
}

function closeMemory() {
    memoryOverlay.classList.remove('visible');
    memoryOverlay.setAttribute('aria-hidden', 'true');
}

function ensureMemoryBeacons() {
    if (memoryBeaconElements.length) return;
    memoryBeaconElements = MEMORY_BEACONS.map((memory) => {
        const element = document.createElement('button');
        element.type = 'button';
        element.className = 'scene-beacon memory-beacon';
        element.setAttribute('aria-label', `Open memory ${memory.title}`);
        element.innerHTML = `<span class="scene-beacon-core" aria-hidden="true"><img class="scene-beacon-gif" src="../../iconntext/Beacon.GIF" alt=""></span><span class="scene-beacon-label">${memory.label}</span>`;
        element.addEventListener('click', () => openMemory(memory));
        document.body.appendChild(element);
        return { element, memory };
    });
    floatingSentenceElements = FLOATING_SENTENCES.map((sentence) => {
        const element = document.createElement('div');
        element.className = 'floating-scene-sentence';
        element.textContent = sentence.text;
        document.body.appendChild(element);
        return { element, sentence };
    });
}

function updateMemoryBeacons() {
    if (!viewer.camera) {
        window.requestAnimationFrame(updateMemoryBeacons);
        return;
    }

    memoryBeaconElements.forEach(({ element, memory }) => {
        if (!memoryBeaconsVisible) {
            element.classList.remove('visible');
            element.classList.remove('near');
            return;
        }
        if (projectSceneBeacon(memory.anchor, element)) {
            const cameraDistance = viewer.camera.position.distanceTo(memory.anchor);
            element.classList.toggle('near', cameraDistance <= MEMORY_REVEAL_DISTANCE);
        }
    });
    floatingSentenceElements.forEach(({ element, sentence }) => {
        if (!memoryBeaconsVisible) {
            element.classList.remove('visible');
            return;
        }
        if (projectSceneBeacon(sentence.anchor, element)) {
            const cameraDistance = viewer.camera.position.distanceTo(sentence.anchor);
            element.classList.toggle('visible', cameraDistance <= FLOATING_SENTENCE_REVEAL_DISTANCE);
        }
    });

    window.requestAnimationFrame(updateMemoryBeacons);
}

function toggleMemoryBeacons() {
    ensureMemoryBeacons();
    memoryBeaconsVisible = !memoryBeaconsVisible;
    if (!memoryBeaconsVisible) closeMemory();
}


window.addEventListener('pointerdown', hideHint, { once: true });
window.addEventListener('wheel', hideHint, { once: true });
window.addEventListener('keydown', hideHint, { once: true });
window.addEventListener('pointerdown', hideHeroTitle, { once: true });
window.addEventListener('wheel', hideHeroTitle, { once: true });
window.addEventListener('keydown', hideHeroTitle, { once: true });
updateViewIndicator();
updateMemoryBeacons();
memoryClose.addEventListener('click', closeMemory);
memoryOverlay.addEventListener('click', (event) => {
    if (event.target === memoryOverlay) closeMemory();
});
window.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeMemory();
});

async function loadScene() {
    try {
        const response = await fetch('../../Scenes/musicdep_1.ksplat');
        if (!response.ok) throw new Error(`HTTP ${response.status} while fetching musicdep_1.ksplat`);

        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);

        await viewer.addSplatScene(blobUrl, {
            format: GaussianSplats3D.SceneFormat.KSplat,
            rotation: [modelRotation.x, modelRotation.y, modelRotation.z, modelRotation.w],
            showLoadingUI: false,
            progressiveLoad: false
        });

        if (viewer.controls) {
            viewer.controls.minPolarAngle = 0;
            viewer.controls.maxPolarAngle = Math.PI;
            viewer.controls.enablePan = true;
            viewer.controls.minDistance = minCameraDistance;
            viewer.controls.maxDistance = maxCameraDistance;
            viewer.controls.update();
        }

        enforceCameraConstraints();
        info.classList.add('hidden');
        window.setTimeout(() => {
            info.style.display = 'none';
        }, 450);
        viewer.start();
        document.body.classList.remove('scene-loading');
        bindSceneCoordinatePicker({ viewer, THREE });
        showHeroTitle();
    } catch (err) {
        console.error(err);
        showLoadFailure(info, err, { scenePath: '../../Scenes/musicdep_1.ksplat' });
    }
}

loadScene();
const reviewMemosButton = document.getElementById('review-memos');
if (reviewMemosButton) {
    const replacement = reviewMemosButton.cloneNode(true);
    reviewMemosButton.replaceWith(replacement);
    replacement.addEventListener('click', toggleMemoryBeacons);
}
</script>
</body>
